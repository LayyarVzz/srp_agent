[project]
name = "srp-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=50.0.0",
    "fastapi[standard]>=0.140.13",
    "fastmcp>=3.4.5",
    "httpx>=0.28.1",
    "langchain>=1.3.14",
    "langchain-core>=1.5.3",
    "langchain-mcp-adapters>=0.3.1",
    "langchain-openai>=1.4.1",
    "langgraph>=1.2.10",
    "langgraph-checkpoint-postgres>=3.1.2",
    "langgraph-prebuilt>=1.1.0",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.14.2",
    "rank-bm25>=0.2.2",
    "sqlalchemy[asyncio]>=2.0",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "RUF"]
# 中文 docstring/注释使用全角标点是项目惯例，禁用歧义字符规则
extend-ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# 测试用例必然出现假凭据/占位密钥（S105 硬编码口令 / S106 口令关键字参数），
# 与 S101 同理属测试豁免；真实密钥一律经 SecretStr 注入，不落测试源码。
"tests/**" = ["S101", "S105", "S106"]
"scripts/**" = ["S101"]
# S105 在本文件为误报：飞书 OAuth 端点 path 常量字面量含 "token"（`/oauth/token`）
# 被判为「硬编码口令」。该值是公开的接口路径、非机密；真实机密只有从配置读取的
# app_secret / lark_token_key（均经 SecretStr，绝不硬编码）。
"shared/lark/oauth.py" = ["S105"]

[tool.ruff.format]
quote-style = "double"
